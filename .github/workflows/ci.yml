name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            desktop/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt -r desktop/requirements.txt
      - run: python -m black --check tools desktop
      - run: python -m pytest desktop/tests -q
      - name: Prepare native collection
        if: matrix.os == 'windows-latest'
        run: python desktop/tools/assets.py import web
      - name: Native original-file integration
        if: matrix.os == 'windows-latest'
        run: python -m pytest desktop/tests --with-originals -q
      - run: python tools/check-doc-links.py
      - run: python tools/check-repo.py
